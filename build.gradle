plugins {
    id 'java'
    id 'application'
}

group = 'org.phoenix'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

// Define dependency versions
def lwjglVersion = '3.3.4'
def jomlVersion = '1.10.8'
def imguiJavaAppVersion = '1.86.11'


dependencies {
    // Use LWJGL BOM for consistent versions
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    implementation "io.github.spair:imgui-java-binding:$imguiJavaAppVersion"
    implementation "io.github.spair:imgui-java-lwjgl3:$imguiJavaAppVersion"
    implementation "io.github.spair:imgui-java-app:$imguiJavaAppVersion"

    implementation "org.lwjgl:lwjgl-stb:$lwjglVersion"
    implementation "org.lwjgl:lwjgl-openal:$lwjglVersion"
    implementation "org.lwjgl:lwjgl:$lwjglVersion"
    implementation "org.lwjgl:lwjgl-glfw:$lwjglVersion"
    implementation "org.lwjgl:lwjgl-opengl:$lwjglVersion"
    implementation "org.joml:joml:$jomlVersion"

    runtimeOnly "org.lwjgl:lwjgl:$lwjglVersion:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-glfw:$lwjglVersion:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-opengl:$lwjglVersion:natives-windows"
    runtimeOnly platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

}

// Configure the main class for the application plugin
application {
    mainClass = 'com.phoenix.core.PhoenixGameEngine'
}

test {
    useJUnitPlatform()
}
